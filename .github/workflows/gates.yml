name: gates

# Every push. No keys, no paid API, no mainnet. Fails fast and short. Copied from jishnu-baruah/hydra.

on:
  push:
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    # First, because a leaked key is the one failure you cannot undo by pushing a fix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --exit-code 1

      - name: No .env or key file is committed
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)\.env$|\.env\.(local|production)$|\.pem$|\.key$|keystore.*\.json$'; then
            echo "::error::A .env or key file is committed. Keys live in .env or GitHub secrets, never in the repo."
            exit 1
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Which parts exist yet?
        id: parts
        run: |
          echo "contracts=$([ -f contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "skill=$([ -f skills/human-pulse/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Separate steps, so a red run names the one thing that broke.
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.parts.outputs.contracts == 'true'

      - name: Contracts, build
        if: steps.parts.outputs.contracts == 'true'
        working-directory: contracts
        run: forge build --sizes

      - name: Contracts, unit tests
        if: steps.parts.outputs.contracts == 'true'
        working-directory: contracts
        # Offline: fork tests live in test/fork/ and need an RPC, so CI skips them.
        run: forge test --no-match-path 'test/fork/*' -vv

      - uses: actions/setup-node@v4
        if: steps.parts.outputs.web == 'true' || steps.parts.outputs.skill == 'true'
        with:
          node-version: 22

      - name: Skill, tests
        if: steps.parts.outputs.skill == 'true'
        working-directory: skills/human-pulse
        run: npm ci && npm test --if-present

      - name: Web, build
        if: steps.parts.outputs.web == 'true'
        working-directory: web
        run: npm ci && npm run build
